# M5 最小 CI：只验证"能配置、能编译、单测全绿"。
# 现状：尚未在 GitHub Actions 上跑过（仓库私有，首次运行要拉全第三方依赖，约 10-20 分钟）。
# 触发方式刻意设为手动 + tag，避免未验证的工作流在每次 push 时红叉。
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.12.0 (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Fetch third-party deps
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Configure
        shell: pwsh
        run: cmake -B build -A x64 -DQt6_DIR="$env:QT_ROOT_DIR/lib/cmake/Qt6"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j 8

      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure
