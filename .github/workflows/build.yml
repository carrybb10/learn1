# M5 minimal CI: configure, build, run pure-function unit tests.
# Trigger: manual or on version tags (keep push-triggered runs off until the workflow is proven).
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.12.0 (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: 'win64_msvc2022_64'
          cache: true

      # third_party is ~2.5GB of sources/libs at pinned commits; cache it between runs.
      - name: Cache third_party
        uses: actions/cache@v4
        with:
          path: third_party
          key: thirdparty-${{ runner.os }}-llama4ebdf2c-whisper60c0be6-ffmpeg-latest-sdl2.32.4

      - name: Fetch third-party deps
        shell: pwsh
        run: ./scripts/fetch-deps.ps1 -SkipModels

      - name: Configure
        shell: pwsh
        run: cmake -B build -A x64 -DQt6_DIR="$env:QT_ROOT_DIR/lib/cmake/Qt6"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j 4

      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/*.log
            crash_reports/*.txt
          if-no-files-found: ignore
