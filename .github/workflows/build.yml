# M5 minimal CI: configure, build, run pure-function unit tests.
# Trigger: manual or on version tags (keep push-triggered runs off until the workflow is proven).
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Qt 6.12.0 / 6.11.x moved to a per-arch repository layout that the newest aqtinstall
      # (3.3.0) still cannot resolve: it asks for qt6_6120/qt6_6120/Updates.xml, which is 404.
      # So we install Qt ourselves and walk a short candidate list, newest resolvable first.
      # qtbase is enough: the project only uses Core/Gui/Widgets.
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check aqtinstall
          $root = Join-Path $env:RUNNER_WORKSPACE 'Qt'
          foreach ($v in @('6.10.3', '6.9.3', '6.8.3')) {
            Write-Host "== trying Qt $v =="
            python -m aqt install-qt windows desktop $v win64_msvc2022_64 --archives qtbase -O $root
            if ($LASTEXITCODE -eq 0) { $picked = $v; break }
            Write-Host "Qt $v not installable, falling back"
          }
          if (-not $picked) { throw "no installable Qt version" }
          $qt6 = "$root/$picked/msvc2022_64/lib/cmake/Qt6"
          if (-not (Test-Path "$qt6/Qt6Config.cmake")) { throw "Qt6Config.cmake missing under $qt6" }
          "QT_VERSION=$picked" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QT6_DIR=$qt6" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "using Qt $picked from $qt6"

      # third_party is ~2.5GB of sources/libs at pinned commits; cache it between runs.
      - name: Cache third_party
        uses: actions/cache@v4
        with:
          path: third_party
          key: thirdparty-${{ runner.os }}-llama4ebdf2c-whisper60c0be6-ffmpeg-latest-sdl2.32.4

      - name: Fetch third-party deps
        shell: pwsh
        run: ./scripts/fetch-deps.ps1 -SkipModels

      - name: Configure
        shell: pwsh
        run: cmake -B build -A x64 -DQt6_DIR="$env:QT6_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug -j 4

      - name: Tests (unit + d3d11 probe)
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/*.log
            crash_reports/*.txt
          if-no-files-found: ignore
